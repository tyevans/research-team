# Backends the integration tests need. Started deliberately, never by the
# default test run:
#
#     docker compose -f docker-compose.test.yml up -d
#     uv run pytest -m integration
#
# Ports 7688 and 55432 rather than 7687 and 5432, so a run cannot reach a
# server anybody is using for anything else -- these tests delete their
# tenant's rows when they finish. `docker-compose.yml` is the one that binds
# the ordinary ports and keeps its data; this file is disposable and both can
# be up at the same time.
services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/redstring
    ports: ["7688:7687", "7475:7474"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p redstring 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # No volume, unlike `docker-compose.yml`: this database is meant to be
  # thrown away, and an anonymous volume that survived `down` would let one
  # run's `kg_vectors` table decide the next run's dimension.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: redstring
      POSTGRES_PASSWORD: redstring
      POSTGRES_DB: redstring
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redstring -d redstring"]
      interval: 5s
      timeout: 5s
      retries: 30
