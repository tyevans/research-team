[project]
name = "research-team"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.1,<0.8",
    "eventsource-py[sqlite]>=0.9.1",
    "fastapi>=0.141.1",
    "langchain-openai>=1.4.1",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
# Tracing is opt-in: the library's spans are no-ops without OpenTelemetry, so
# a default install stays light and a developer with no collector pays nothing.
# `uv sync --extra tracing`, then AGENT_TRACING=1.
tracing = [
    "eventsource-py[telemetry]>=0.9.1",
    "opentelemetry-exporter-otlp-proto-http>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real model endpoint; deselected by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 95

[tool.ruff.lint]
# Chosen to match what the code already does rather than to impose a new style.
# BLE earns its place: every broad `except` here is deliberate and already
# carries a `noqa` explaining why, and enabling the rule is what makes those
# comments load-bearing instead of decorative.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test doubles keep mutable class attributes on purpose, to record what they saw.
"tests/*" = ["RUF012"]
