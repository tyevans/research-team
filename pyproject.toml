[project]
name = "research-team"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.6,<0.8",
    # Capped below the next minor, as redstring caps it. Both libraries are
    # pre-1.0 with a stated no-shim policy, so a minor is where the breaking
    # renames land -- 0.12.0 carried four and 0.14.0 carried seventeen. An
    # uncapped floor means a resolver is free to pick the release that breaks
    # us.
    #
    # redstring pins this to one minor exactly rather than a range, on the
    # reasoning that a two-version window is a test matrix nobody runs. So
    # there is no version of eventsource-py that satisfies both the current
    # redstring and the previous one, and the two cannot be bumped in separate
    # commits even if someone wanted to.
    "eventsource-py[sqlite]>=0.14.0,<0.15",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.5.1",
    # Course artifacts carry YAML frontmatter, so something has to read it back.
    # Already present transitively (langchain, uvicorn, redstring all pull it),
    # and named here because `application/artifacts.py` imports it directly --
    # an undeclared dependency works right up until the day one of those three
    # drops it.
    "pyyaml>=6.0",
    # FastAPI parses multipart bodies through this and does not depend on it:
    # `Form`/`UploadFile` raise a RuntimeError at *request* time, not import
    # time, so a build without it starts cleanly and answers 500 on the first
    # media upload. Named here because the media route is the only multipart
    # surface in the app and its absence has exactly one symptom.
    "python-multipart>=0.0.20",
    # `pgvector` is named rather than left to resolve transitively. It brings
    # `asyncpg`, which `build_vector_store` imports lazily for
    # `AGENT_VECTOR_STORE=pgvector`; without the extra that import worked only
    # because something else in the tree happened to pull asyncpg in, and a
    # dependency nobody declared is one a resolver is free to drop. Adding that
    # extra did not move the window -- an extra adds packages, it does not
    # renegotiate the minor -- which is why it landed on its own. 0.7.0 was
    # the other case: it narrowed its own `eventsource-py` pin, so the two had
    # to move together, here and in the `tracing` extra below.
    #
    # 0.8.0 is neither, and is the rare minor here that is a one-line bump. It
    # leaves `eventsource-py>=0.14.0,<0.15` exactly where 0.7.0 put it, so that
    # window does not move; and it adds `concurrency` and `CallLimiter` to the
    # public surface without renaming or removing anything. `concurrency`
    # defaults to 1, which upstream states is byte-identical to the serial
    # pipeline -- same calls, same prompts, same order -- so the bump alone
    # cannot have changed what extraction produces. `ingest` passes the knob
    # deliberately; see `AGENT_EXTRACTION_CONCURRENCY`.
    #
    # 0.6.0 is still the release to read before assuming any of these were only
    # version bumps: it widened `ConsolidationService.__init__`'s `graph_store`
    # from `RelationshipStore` to `ConsolidationGraph`, which is a silent
    # runtime break for a narrow duck-typed double -- it type-checks nowhere
    # and fails at the first `resolve`. Nothing here passes one; every store
    # handed to a `Consolidator` is redstring's own.
    # Pinned to a commit on `main` rather than a release, because the fix this
    # needs is merged and unreleased: redstring PR #72 stops
    # `SlidingWindowChunker` emitting chunks wholly contained in another. That
    # matters here twice -- the quotable corpus is chunked with it, and so is
    # extraction.
    #
    # **A SHA, not `@main`.** A branch ref resolves to something different on
    # every `uv lock`, which is exactly what CI's `--locked` exists to prevent;
    # the lockfile would still pin bytes, but nobody could tell from this file
    # what they were meant to be. Swap this back to a version range the moment
    # 0.10.0 is released -- a git dependency also means every install needs to
    # reach GitHub, which a released wheel does not.
    #
    # This crosses the `<0.10` cap the line below used to carry, and the cap's
    # reasoning still stands -- a minor is where redstring's breaking renames
    # land. Checked rather than assumed before crossing it: the package root's
    # public surface at this commit is a superset of 0.9.2's (`Theme`,
    # `ThemeReport` and `summarize_themes` added, nothing removed), and its
    # `eventsource-py>=0.14.0,<0.15` is identical to ours, so the two libraries
    # do not have to move together this time.
    "redstring[llm,neo4j,pgvector] @ git+https://github.com/tyevans/redstring.git@8de0cb26dcbbd23abe3fdeb19da3940ea90ee274",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.3",
    # The blob store streams to disk with async file handles rather than
    # blocking the event loop on ordinary `open()` -- see `blob_store.py`.
    "aiofiles>=24.1",
    # Perception over stored media: renders a video, audio file or image to
    # text plus a locator map from character offsets to time spans and
    # regions. Capped below the next minor for the reason eventsource-py and
    # redstring are -- pre-1.0, and a minor is where the breaking renames
    # land. The extras: `remote-transcription` is httpx (already present),
    # `vision` is langchain-openai (already present), and `images` and
    # `documents` add pillow and pypdfium2, which are new weight bought for
    # image and PDF handling. ffmpeg/ffprobe are OS binaries and are
    # deliberately not represented here.
    #
    # 0.3.0 is the second bump this branch made and, unusually for a pre-1.0
    # minor, a purely additive one: an `__all__` diff removes nothing, adds
    # sixteen names for archive/container and Office handling, and gives
    # `build_perception` two defaulted keyword arguments. Every signature this
    # project depends on is unchanged, and all three of the spec's measurements
    # were re-taken against it rather than assumed to carry -- byte-identical.
    # The one behaviour change to know about is not one we exercise: container
    # walking is on by default, so a `.zip` or `.docx` stored as a medium would
    # now be walked where it previously fell to `BinaryHandler`.
    "readeverything[documents,images,remote-transcription,vision]>=0.3.0,<0.4",
]

[project.optional-dependencies]
# Tracing is opt-in: the library's spans are no-ops without OpenTelemetry, so
# a default install stays light and a developer with no collector pays nothing.
# `uv sync --extra tracing`, then AGENT_TRACING=1.
tracing = [
    "eventsource-py[telemetry]>=0.14.0,<0.15",
    "opentelemetry-exporter-otlp-proto-http>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.165.8",
    "mutmut>=3.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The repo root, explicitly, so `research_team` is importable from tests.
# This project declares no `[build-system]`, so `uv sync` installs its
# dependencies but not the project itself -- importing it has always relied on
# the root being on `sys.path`. uv 0.8 put it there implicitly for a project
# like this and uv 0.12 does not, which surfaced as a `ModuleNotFoundError` in
# CI (which floats to the latest uv) while every local run stayed green. Saying
# it here makes the suite independent of that.
pythonpath = ["."]
markers = [
    "live: hits the real model endpoint; deselected by default",
    "integration: hits a real backend service (e.g. Neo4j); deselected by default",
]
addopts = "-m 'not live and not integration'"

[tool.ruff]
line-length = 95

# The files ruff owns, stated rather than inherited. 0.16 added markdown to the
# default set and began reformatting Python inside fenced blocks, which here
# means the design docs under `docs/` -- illustrative snippets, hand-aligned to
# read as prose, and in places verbatim quotations of a third-party library's
# source. Reformatting a quotation makes it stop being one. Naming the set keeps
# a future default from silently claiming another file type.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
# Chosen to match what the code already does rather than to impose a new style.
# BLE earns its place: every broad `except` here is deliberate, and enabling the
# rule is what makes the comment explaining each one load-bearing instead of
# decorative. Most carry a `noqa`; the one that logs with `exc_info=True` no
# longer needs one, because ruff reads that as handling rather than swallowing.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test doubles keep mutable class attributes on purpose, to record what they saw.
"tests/*" = ["RUF012"]

[tool.mutmut]
source_paths = [
    "research_team/application/autonomy.py",
    "research_team/infrastructure/agent/search.py",
    "research_team/infrastructure/agent/approval.py",
]
# --import-mode=importlib avoids pytest's bare-module-name collision: mutmut
# always copies tests/ into mutants/tests/ (its own also_copy default, not
# ours), and this repo's test files have no __init__.py. Under the default
# "prepend" import mode, running pytest against both the real tests/ tree and
# mutmut's copy in the same process (mutmut does this deliberately -- once
# for stats collection, again for its "clean tests" baseline) raises
# `import file mismatch` for a bare module name collected from two different
# paths. importlib mode keys modules by their exact file path instead, so the
# two copies never collide. (This requires every `from conftest import ...`
# in tests/ to be phrased as `from tests.conftest import ...`, which
# tests/domain/test_session.py was not doing -- fixed alongside this.)
pytest_add_cli_args_test_selection = ["--import-mode=importlib", "tests/"]
# The three target files import sibling modules within research_team; mutmut only
# copies the paths it mutates into mutants/, so the rest of the package must be
# copied too or test collection fails on missing imports (e.g. `composition`).
also_copy = ["research_team"]
