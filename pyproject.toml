[project]
name = "research-team"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.5,<0.8",
    # Capped below the next minor, as redstring caps it. Both libraries are
    # pre-1.0 with a stated no-shim policy, so a minor is where the breaking
    # renames land -- 0.12.0 alone carried four. An uncapped floor means a
    # resolver is free to pick the release that breaks us.
    "eventsource-py[sqlite]>=0.13.0,<0.14",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.4.2",
    # Course artifacts carry YAML frontmatter, so something has to read it back.
    # Already present transitively (langchain, uvicorn, redstring all pull it),
    # and named here because `application/artifacts.py` imports it directly --
    # an undeclared dependency works right up until the day one of those three
    # drops it.
    "pyyaml>=6.0",
    # `pgvector` is named rather than left to resolve transitively. It brings
    # `asyncpg`, which `build_vector_store` imports lazily for
    # `AGENT_VECTOR_STORE=pgvector`; without the extra that import worked only
    # because something else in the tree happened to pull asyncpg in, and a
    # dependency nobody declared is one a resolver is free to drop. The window
    # is unchanged, so `eventsource-py` and the `tracing` extra do not move
    # with it -- an extra adds packages, it does not renegotiate the minor.
    "redstring[llm,neo4j,pgvector]>=0.5.0,<0.6",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
# Tracing is opt-in: the library's spans are no-ops without OpenTelemetry, so
# a default install stays light and a developer with no collector pays nothing.
# `uv sync --extra tracing`, then AGENT_TRACING=1.
tracing = [
    "eventsource-py[telemetry]>=0.13.0,<0.14",
    "opentelemetry-exporter-otlp-proto-http>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.165.2",
    "mutmut>=3.0",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The repo root, explicitly, so `research_team` is importable from tests.
# This project declares no `[build-system]`, so `uv sync` installs its
# dependencies but not the project itself -- importing it has always relied on
# the root being on `sys.path`. uv 0.8 put it there implicitly for a project
# like this and uv 0.12 does not, which surfaced as a `ModuleNotFoundError` in
# CI (which floats to the latest uv) while every local run stayed green. Saying
# it here makes the suite independent of that.
pythonpath = ["."]
markers = [
    "live: hits the real model endpoint; deselected by default",
    "integration: hits a real backend service (e.g. Neo4j); deselected by default",
]
addopts = "-m 'not live and not integration'"

[tool.ruff]
line-length = 95

# The files ruff owns, stated rather than inherited. 0.16 added markdown to the
# default set and began reformatting Python inside fenced blocks, which here
# means the design docs under `docs/` -- illustrative snippets, hand-aligned to
# read as prose, and in places verbatim quotations of a third-party library's
# source. Reformatting a quotation makes it stop being one. Naming the set keeps
# a future default from silently claiming another file type.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
# Chosen to match what the code already does rather than to impose a new style.
# BLE earns its place: every broad `except` here is deliberate, and enabling the
# rule is what makes the comment explaining each one load-bearing instead of
# decorative. Most carry a `noqa`; the one that logs with `exc_info=True` no
# longer needs one, because ruff reads that as handling rather than swallowing.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test doubles keep mutable class attributes on purpose, to record what they saw.
"tests/*" = ["RUF012"]

[tool.mutmut]
source_paths = [
    "research_team/application/autonomy.py",
    "research_team/infrastructure/agent/search.py",
    "research_team/infrastructure/agent/approval.py",
]
# --import-mode=importlib avoids pytest's bare-module-name collision: mutmut
# always copies tests/ into mutants/tests/ (its own also_copy default, not
# ours), and this repo's test files have no __init__.py. Under the default
# "prepend" import mode, running pytest against both the real tests/ tree and
# mutmut's copy in the same process (mutmut does this deliberately -- once
# for stats collection, again for its "clean tests" baseline) raises
# `import file mismatch` for a bare module name collected from two different
# paths. importlib mode keys modules by their exact file path instead, so the
# two copies never collide. (This requires every `from conftest import ...`
# in tests/ to be phrased as `from tests.conftest import ...`, which
# tests/domain/test_session.py was not doing -- fixed alongside this.)
pytest_add_cli_args_test_selection = ["--import-mode=importlib", "tests/"]
# The three target files import sibling modules within research_team; mutmut only
# copies the paths it mutates into mutants/, so the rest of the package must be
# copied too or test collection fails on missing imports (e.g. `composition`).
also_copy = ["research_team"]
