# Dependency updates.
#
# The console currently reports zero advisories from `npm audit`. Nothing about
# that is durable — it is a statement about today's advisory database, not about
# the code — and the way it decays is silently. This is the mechanism that turns
# that decay into a pull request instead of a surprise.
#
# Weekly rather than daily: a queue of open bumps nobody reviews is worse than a
# slightly older lockfile, because it trains everyone to ignore the queue.
#
# Grouped rather than one PR per package, for the same reason. A group that
# fails CI is one investigation; fifteen PRs that each fail CI are fifteen.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # `@typescript-eslint/*` 8.x declares `typescript@">=4.8.4 <6.1.0"`, so a
      # major bump of typescript does not resolve at all — `npm ci` fails with
      # ERESOLVE before a single check runs. That would be tolerable on its own;
      # what makes it worth an ignore is the grouping. typescript rides in the
      # `toolchain` group, so one unresolvable major holds every other bump in
      # the group hostage — an eslint patch sat unmergeable behind typescript 7
      # in #104, which is what prompted this.
      #
      # Remove this the moment typescript-eslint ships a release whose peer
      # range admits the current typescript major. It is a statement about one
      # upstream peer range today, not a decision to stay on typescript 5.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # The toolchain moves together and breaks together — a typescript-eslint
      # bump that needs a matching eslint bump is not reviewable in isolation.
      toolchain:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'prettier'
          - 'typescript'
          - 'vite'
          - 'vitest'
          - '@vitest/*'
          - '@vitejs/*'
      testing:
        patterns:
          - '@testing-library/*'
          - 'jsdom'
      # React and its types are one decision.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      runtime:
        dependency-type: production
        exclude-patterns:
          - 'react'
          - 'react-dom'

  # Actions are pinned to commit SHAs in `ci.yml`, which is the right default
  # and also means a tag moving does nothing for us. Dependabot is how those
  # pins get advanced deliberately rather than never.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - '*'
