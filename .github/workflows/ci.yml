# CI
#
# Every job installs with `uv sync --all-extras --locked` and runs tools
# through `uv run`, so CI executes the same versions a developer has locally.
# `--locked` is right here in a way it would not be for a library: this is an
# application, `uv.lock` is committed, and a resolution that drifts between a
# developer's machine and this gate is a bug rather than early warning.
#
# The integration job is the reason this file exists. The default suite
# deselects `-m integration` because those tests need a real Neo4j and a real
# Postgres, and a developer should not have to run either to commit. CI is
# where a server is free, so that is where they run -- on every pull request,
# not on a laptop.
#
# Third-party actions are pinned to a full commit SHA with the tag in a
# trailing comment. A tag is a mutable pointer: whoever controls the action
# repository can move it.

name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately. It used to say `[main]`, which meant a
  # PR whose base was another feature branch got no CI at all -- and the checks
  # tab showed nothing rather than a failure, so the PR looked ready. That was
  # measured on #203, a stacked PR that sat green-looking with zero jobs run;
  # the fix at the time was to retarget it at main, which is not available to a
  # stack that genuinely depends on its parent. A stacked PR is exactly as much
  # a candidate for these four gates as one aimed at main.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras --locked

      # No `-m` override: the default addopts already deselect `live` and
      # `integration`. Naming a marker here would silently diverge from what
      # the same command does on a developer's machine.
      - run: uv run pytest

  integration:
    name: pytest -m integration
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/redstring
        ports:
          - 7688:7687
        # `services` starts the container but does not wait for the server to
        # answer, so without a healthcheck the first test races the boot.
        options: >-
          --health-cmd "cypher-shell -u neo4j -p redstring 'RETURN 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      # `pgvector/pgvector` rather than `postgres`: `vector` is a compiled
      # extension, so the stock image cannot create it however the database is
      # initialised. Nothing else has to be done to prepare it --
      # `PgVectorStore.ensure_schema` issues `CREATE EXTENSION IF NOT EXISTS
      # vector` alongside its DDL, and `POSTGRES_USER` owns the database it
      # was created with, so it may.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: redstring
          POSTGRES_PASSWORD: redstring
          POSTGRES_DB: redstring
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U redstring -d redstring"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      AGENT_NEO4J_URI: bolt://localhost:7688
      AGENT_NEO4J_USER: neo4j
      AGENT_NEO4J_PASSWORD: redstring
      # Matches `docker-compose.test.yml`'s port, so the same command runs the
      # same way on a laptop and here.
      AGENT_PGVECTOR_DSN: postgresql://redstring:redstring@localhost:55432/redstring

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - run: uv sync --all-extras --locked

      # `live` stays deselected: it hits a real model endpoint, which this
      # runner has no way to reach.
      - run: uv run pytest -m "integration and not live"

  console:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `.nvmrc` rather than a literal, so a developer's `nvm use` and this
          # runner cannot disagree about which Node the build ran on. It names a
          # full version rather than `24` for the same reason: a major resolves
          # to whatever the runner has newest, so the npm that reads the
          # lockfile could change with no commit anywhere. That is not
          # hypothetical -- it happened on #126, and the failure lands at
          # `npm ci`, which means every step below is *skipped* rather than
          # failed and the pull request goes green-ish with nothing checked.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`: the lockfile is committed, and a resolution
      # that drifts between this gate and a developer's machine is a bug.
      - run: npm ci
        working-directory: frontend

      # Each check is its own step rather than one `npm run verify`, so the
      # failing box in the pull request names what broke without anyone opening
      # the log. `verify` runs the same list locally, in the same order.
      - name: prettier --check
        run: npm run format:check
        working-directory: frontend

      - name: eslint
        run: npm run lint
        working-directory: frontend

      - name: tsc --noEmit
        run: npm run typecheck
        working-directory: frontend

      - name: vitest
        run: npm run test:coverage
        working-directory: frontend

      # `npm run verify` has run this since it was written; CI never has, so
      # the one gate that catches a superseded pattern coming back was enforced
      # only on machines where somebody remembered to run the whole chain. A
      # branch that ran `lint` and `test` and pushed reached `main` with a
      # restored `title=` and nothing to say so.
      #
      # Cheap and independent of the build, so it sits with the other static
      # checks rather than after it.
      - name: superseded patterns stay deleted
        run: npm run deleted
        working-directory: frontend

      # The built console is no longer committed (see `.gitignore`), so there
      # is nothing here to compare against and nothing to go stale. The build
      # still runs, because the bundle budget below measures its output and a
      # branch that cannot build is a branch that cannot serve.
      - name: build
        run: npm run build
        working-directory: frontend

      # After the build, because it measures the build. A dependency's weight is
      # a fact about the shipped artefact, not about `package.json`.
      - name: bundle budget
        run: npm run size
        working-directory: frontend

      # Advisories are published against versions already installed, so this can
      # fail on a pull request that changed nothing — which is the point, and
      # why the bar is `high` rather than `low`: at that level the interruption
      # is rare enough to be worth stopping for. Dependabot (`dependabot.yml`)
      # is what raises the fix; this is what makes ignoring it impossible.
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend

  # `npm run test:browser` -- headless Chromium over `src/**/*.browser.test.tsx`.
  #
  # CLAUDE.md says this suite is "deliberately outside `verify` and outside
  # CI", and B140 gives the three costs behind that: a minute per run against a
  # second, a Chromium download, and 923 jsdom tests competing for the same
  # budget. This job argues with that reasoning rather than around it.
  #
  # The third cost is the one that turns out not to apply here, and it is what
  # makes this a separate job rather than a step in `console`. Nothing competes
  # for a budget: this is its own runner, in parallel, so `console` reports in
  # exactly the time it did before and the pull request's wall clock is
  # unchanged unless this is the slowest job, which it is not -- `integration`
  # boots Neo4j and Postgres.
  #
  # The first two are real and are paid on every pull request. `--only-shell`
  # is what keeps the download to the rendering engine rather than a browser,
  # and `setup-node`'s npm cache covers the rest. A minute of a parallel runner
  # is the price; B140 records what the alternative costs.
  #
  # A narrower job -- run only when `src/styles/**` or `presentation/layout/**`
  # changed -- was the first design and was dropped. GitHub's `paths` filter is
  # per *workflow*, not per job, so scoping one job means a third-party
  # changed-files action, which this file pins by SHA and audits; and B140's
  # own instance escapes the filter anyway. #249 touched neither directory --
  # it added Storybook stories -- and it is the merge that left the suite red
  # for four commits. A filter drawn around the last failure would not have
  # caught the last failure.
  #
  # What is deliberately *not* argued: nothing here forces anyone to run the
  # suite locally, which is the property CLAUDE.md states. It stays out of
  # `verify`, and touching a stylesheet is still a reason to run it by hand
  # before pushing -- this is the net, not the practice.
  #
  # And the cost of leaving it out is measured rather than predicted. B140:
  # #249 added Toasts stories, passed all four gates, merged, and left
  # `a11y.browser.test.tsx` red with eight contrast violations -- red across
  # four merged commits with every gate green, found weeks later by the next
  # person who ran the suite by hand and had to work out which merge did it.
  # The violations turned out to be phantoms, which is not the point: nothing
  # could tell anyone that at the time.
  #
  # `continue-on-error` is deliberately absent. A job that cannot fail is a
  # notification, and B140's whole complaint is that a notification nobody
  # received is what four green merges over a red suite look like.
  browser:
    name: vitest --project browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `--only-shell` rather than the full browser: these tests need a
      # rendering engine, not a browser UI, and the headless shell is a
      # fraction of the download. `--with-deps` because a bare Ubuntu runner
      # has none of the shared libraries Chromium links against, and the
      # failure without it is a missing `.so` that names nothing about
      # Playwright.
      - name: install chromium
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend

      - name: vitest --project browser
        run: npm run test:browser
        working-directory: frontend
